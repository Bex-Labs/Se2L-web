<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se2L — Task detail</title>
  <link href="css/output.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="css/shell.css" rel="stylesheet">
  <link href="css/task-detail.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="mobile-topbar">
    <span class="text-base font-semibold">Se2L</span>
    <button id="mobile-menu-btn" class="text-2xl leading-none text-slate-600" aria-label="Open menu">☰</button>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-shell">

    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L2 7V12C2 16.97 6.24 21.44 12 22.5C17.76 21.44 22 16.97 22 12V7L12 2Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9 12L11 14L15.5 9.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="app-sidebar-title">Se2L</span>
      </div>

      <div class="sidebar-identity">
        <div id="sidebar-identity-avatar" class="sidebar-identity-avatar">··</div>
        <div class="sidebar-identity-info">
          <span id="sidebar-user-email" class="sidebar-identity-email">Loading…</span>
          <span id="sidebar-role-pill" class="status-pill">Newcomer</span>
        </div>
      </div>

      <nav class="flex flex-col gap-1" style="margin-top: 1rem;">
        <a id="dashboard-nav-link" href="dashboard.html" class="px-3 py-2 text-sm text-slate-600">Dashboard</a>
        <a id="app-manager-link" href="app-manager.html" class="hidden px-3 py-2 text-sm text-slate-600">Manage content</a>
        <a id="super-admin-link" href="super-admin.html" class="hidden px-3 py-2 text-sm text-slate-600">Platform overview</a>
        <a href="resources.html" class="px-3 py-2 text-sm text-slate-600">Resources</a>
        <a href="settings.html" class="px-3 py-2 text-sm text-slate-600">Settings</a>
      </nav>
      <button id="signout-btn" class="btn btn-ghost btn-sm btn-block" style="margin-top: auto; justify-content: flex-start;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </aside>

    <main class="app-main" id="main-content">
      <div class="task-detail-layout">

        <div class="task-detail-main">
          <a id="back-link" href="dashboard.html" class="text-sm text-slate-500 flex items-center gap-1 mb-4">
            ← Back to dashboard
          </a>

          <div class="flex justify-between items-start">
            <span id="task-meta" class="task-meta-badge">Loading...</span>
            <button id="bookmark-btn" class="btn btn-ghost btn-sm">☆ Bookmark</button>
          </div>
          <h1 id="task-title" class="task-detail-title">Loading…</h1>
          <p id="task-time" class="text-sm text-slate-500 mb-4"></p>

          <div id="task-body" class="card text-sm text-slate-700 mb-4"></div>

          <div id="task-video-container" class="mb-4"></div>

          <div id="task-link-container" class="mb-6"></div>

          <button id="mark-complete-btn" class="btn btn-primary btn-block">
            ✓ Mark complete
          </button>
        </div>

        <div class="task-detail-side">
          <div class="card mb-6">
            <label class="form-label" for="personal-note">Your personal notes</label>
            <textarea id="personal-note" rows="3" class="form-textarea" placeholder="Add a private note for yourself — only you can see this."></textarea>
            <div class="flex justify-end mt-2">
              <button id="save-note-btn" class="btn btn-ghost btn-sm">Save note</button>
            </div>
          </div>

          <div class="card" id="feedback-section">
            <label class="form-label">Was this task helpful?</label>
            <div class="flex gap-3 mb-3">
              <button id="thumbs-up-btn" class="btn flex-1">👍 Yes</button>
              <button id="thumbs-down-btn" class="btn flex-1">👎 No</button>
            </div>
            <textarea id="feedback-comment" rows="2" class="form-textarea" placeholder="Optional comment — visible to the team improving this content"></textarea>
            <div class="flex justify-end mt-2">
              <button id="save-feedback-btn" class="btn btn-ghost btn-sm">Save feedback</button>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-detail.js"></script>

</body>
</html>
