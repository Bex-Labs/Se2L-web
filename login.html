<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se2L — Log in</title>
  <link href="css/output.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Page-specific layout only — buttons, inputs, badges, and dividers
       now come from components.css. Kept local: the overall page frame
       (header/main/footer split), the login card wrapper, and the
       password-visibility toggle, none of which exist on any other page. */

    .login-page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 2rem 1.5rem 0;
    }
    .login-header-mark {
      width: 1.85rem;
      height: 1.85rem;
      color: var(--color-accent);
      flex-shrink: 0;
    }
    .login-header-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--color-text);
    }

    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 24rem;
    }
    .login-card .badge { margin-bottom: 0.75rem; }
    .login-card h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 0.375rem;
      color: var(--color-text);
    }
    .login-card p.login-sub {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .login-field-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .login-field-row .form-label { margin-bottom: 0; }
    .login-forgot {
      font-size: 0.75rem;
      color: var(--color-accent);
      font-weight: 500;
    }
    .login-forgot:hover { text-decoration: underline; }

    .login-password-wrap { position: relative; }
    .login-password-wrap input { padding-right: 2.5rem; }
    .login-toggle-password {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
    }
    .login-toggle-password svg { width: 1.1rem; height: 1.1rem; }

    .login-footer {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.375rem 1.25rem;
    }
    .login-footer span,
    .login-footer a { font-size: 0.7rem; color: var(--color-text-muted); }
    .login-footer a:hover { color: var(--color-text-secondary); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">

  <div class="login-page-wrap">

    <div class="login-header">
      <svg class="login-header-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7V12C2 16.97 6.24 21.44 12 22.5C17.76 21.44 22 16.97 22 12V7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9 12L11 14L15.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="login-header-title">Se2L Settlement</span>
    </div>

    <div class="login-main">
      <div class="login-card card">

        <span class="badge" data-i18n="login.eyebrow">Official entry portal</span>
        <h1 data-i18n="login.heading">Welcome back</h1>
        <p class="login-sub" data-i18n="login.subtext">Log in to pick up your settlement journey where you left off.</p>

        <form id="login-form">

          <div class="form-field">
            <div class="login-field-row">
              <label class="form-label" for="email" data-i18n="login.email_label">Email address</label>
            </div>
            <input id="email" type="email" required class="form-input" placeholder="e.g. name@domain.gov.uk" data-i18n-placeholder="login.email_placeholder" />
          </div>

          <div class="form-field">
            <div class="login-field-row">
              <label class="form-label" for="password" data-i18n="login.password_label">Password</label>
              <a href="#" class="login-forgot" data-i18n="login.forgot">Forgot?</a>
            </div>
            <div class="login-password-wrap">
              <input id="password" type="password" required class="form-input" placeholder="Your password" data-i18n-placeholder="login.password_placeholder" />
              <button type="button" class="login-toggle-password" id="toggle-password" aria-label="Show password" data-i18n-aria-label="login.show_password">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-i18n="login.submit">Sign in &rarr;</button>

        </form>

        <div class="divider-row">
          <span class="divider-row-label" data-i18n="login.divider">New to Se2L</span>
        </div>

        <a href="onboarding.html" class="btn btn-secondary btn-block" data-i18n="login.register">Register account</a>

      </div>
    </div>

    <div class="login-footer">
      <span data-i18n="footer.copyright">Se2L UK &copy; 2026 Se2L UK Settlement Service. All rights reserved.</span>
      <a href="#" data-i18n="footer.privacy">Privacy Policy</a>
      <a href="terms.html" data-i18n="footer.terms">Terms of Service</a>
      <a id="footer-support-link" href="#" data-i18n="footer.contact">Contact Support</a>
      <a href="#" data-i18n="footer.accessibility">Accessibility</a>
    </div>

  </div>

  <script>
    // Show/hide password toggle — presentation-only, doesn't touch
    // login-form's submit handler or any values, so login.js is
    // untouched and unaware this exists.
    document.getElementById("toggle-password").addEventListener("click", function () {
      const pw = document.getElementById("password");
      const isHidden = pw.type === "password";
      pw.type = isHidden ? "text" : "password";
      this.setAttribute("aria-label", isHidden ? window.t("login.hide_password") : window.t("login.show_password"));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
