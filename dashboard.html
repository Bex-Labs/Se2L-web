<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se2L — Dashboard</title>
  <link href="css/output.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/shell.css" rel="stylesheet">
    <link href="css/dashboard.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Mobile top bar -->
  <header class="mobile-topbar">
    <span class="text-base font-semibold">Se2L</span>
    <button id="mobile-menu-btn" class="text-2xl leading-none text-slate-600" aria-label="Open menu">☰</button>
  </header>

  <!-- Backdrop, mobile only, shown while the drawer is open -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-shell">

    <!-- Sidebar: persistent panel on desktop, off-canvas drawer on mobile -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L2 7V12C2 16.97 6.24 21.44 12 22.5C17.76 21.44 22 16.97 22 12V7L12 2Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9 12L11 14L15.5 9.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="app-sidebar-title">Se2L</span>
      </div>

      <div class="sidebar-identity">
        <div id="sidebar-identity-avatar" class="sidebar-identity-avatar">··</div>
        <div class="sidebar-identity-info">
          <span id="sidebar-user-email" class="sidebar-identity-email">Loading…</span>
          <span id="sidebar-role-pill" class="status-pill" data-i18n="roles.newcomer">Newcomer</span>
        </div>
      </div>

      <nav class="flex flex-col gap-1" style="margin-top: 1rem;">
        <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 flex items-center gap-2" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span data-i18n="nav.dashboard">Dashboard</span></a>
        <a id="app-manager-link" href="app-manager.html" class="hidden px-3 py-2 rounded-lg text-sm text-slate-600 flex items-center gap-2" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span data-i18n="nav.manage_content">Manage content</span></a>
        <a id="super-admin-link" href="super-admin.html" class="hidden px-3 py-2 rounded-lg text-sm text-slate-600 flex items-center gap-2" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><span data-i18n="nav.platform_overview">Platform overview</span></a>
        <a href="community.html" class="px-3 py-2 rounded-lg text-sm text-slate-600 flex items-center gap-2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Community</span></a>
        <a href="resources.html" class="px-3 py-2 rounded-lg text-sm text-slate-600 flex items-center gap-2" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span data-i18n="nav.resources">Resources</span></a>
        <a href="settings.html" class="px-3 py-2 rounded-lg text-sm text-slate-600 flex items-center gap-2" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1rem;height:1rem;flex-shrink:0;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="nav.settings">Settings</span></a>
      </nav>

      <div class="sidebar-task-jump-wrap">
        <p class="sidebar-task-jump-heading" data-i18n="dashboard.todays_tasks">Today's tasks</p>
        <div id="sidebar-task-jump-list"></div>
      </div>
      <button id="signout-btn" class="btn btn-ghost btn-sm btn-block" data-i18n="common.sign_out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </aside>

    <!-- Main content — same structure/IDs as before, just inside the shell now -->
    <main class="app-main" id="main-content">
      <div class="max-w-2xl mx-auto">

        <div id="welcome-message" class="mb-6">
          <p class="text-sm text-slate-500" data-i18n="dashboard.loading_journey">Loading your journey...</p>
        </div>

        <div id="progress-strip" class="hidden mb-6"></div>

        <div id="phase-timeline" class="flex gap-2 mb-8 overflow-x-auto">
          <div class="flex-1 text-center py-2 px-1 rounded-lg bg-slate-100 text-slate-400">
            <div class="text-xs mt-1" data-i18n="common.loading">Loading...</div>
          </div>
        </div>

        <div id="phase-review-section" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 id="phase-review-heading" class="text-sm font-medium">Loading…</h3>
            <button type="button" id="phase-review-close-btn" class="btn btn-ghost btn-sm" data-i18n="common.close">Close</button>
          </div>
          <div id="phase-review-tasks" class="flex flex-col gap-2"></div>
        </div>

        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-medium" data-i18n="dashboard.todays_tasks">Today's tasks</h2>
          <span id="task-count" class="text-sm text-slate-500"></span>
        </div>

        <div id="task-list" class="flex flex-col gap-3">
          <p class="text-sm text-slate-400" data-i18n="dashboard.loading_tasks">Loading tasks...</p>
        </div>
        <div id="upcoming-phase-teaser" class="mt-6"></div>
        <div id="family-section"></div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/fr.js"></script>
  <script src="js/lang/zh.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
