<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="css/output.css" rel="stylesheet">
  <link href="css/tokens.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    .legal-wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }
    .legal-wrap h1 {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.6rem;
      color: var(--color-text);
      margin-bottom: 0.35rem;
    }
    #legal-page-body {
      line-height: 1.75;
      color: var(--color-text);
    }
    #legal-page-body p { margin-bottom: 1rem; }
    .legal-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 2rem 1.5rem 0;
    }
    .legal-header-mark {
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 0.45rem;
      background: var(--color-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .legal-header-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--color-navy);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">

  <header class="legal-header">
    <div class="legal-header-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2L2 7V12C2 16.97 6.24 21.44 12 22.5C17.76 21.44 22 16.97 22 12V7L12 2Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12L11 14L15.5 9.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="legal-header-title">Se2L</span>
  </header>

  <main class="legal-wrap">

    <a href="index.html" class="text-sm text-slate-500 flex items-center gap-1 mb-6">
      ← Back home
    </a>

    <h1 id="legal-page-title">Loading...</h1>
    <p class="text-xs text-slate-400 mb-6" id="legal-page-updated"></p>

    <div id="legal-page-body" class="text-sm"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/terms.js"></script>

</body>
